services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant's image has no curl; its own binary can answer for it.
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s

volumes:
  qdrant_storage:
