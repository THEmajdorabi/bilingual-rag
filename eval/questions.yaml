# Evaluation set for bilingual-rag.
#
# PROVENANCE: every question below is marked `verified_by: drafted`. They were
# written by a model against the real text of the cited articles -- not from
# memory of Saudi labour law -- but nobody has yet read the article and
# confirmed the label. Until a human does, these numbers measure the pipeline,
# not its quality.
#
# Promote a question with:  python eval/review.py
# That CLI shows the cited article's text next to the question and records
# `verified_by: human` only when you confirm it.
#
# `run_eval.py` reports the human-verified and drafted populations separately
# and refuses to headline a figure computed over drafted questions.
#
# Composition target from the spec: 45 answerable Arabic, 20 cross-lingual,
# 15 unanswerable, with at least 15 of the answerable ones tagged multi_hop.

