services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    depends_on:
      - qdrant
    ports:
      - "8080:8080"
    environment:
      # Keys come from the host environment or a .env file. Never baked into
      # the image, never committed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      BILINGUAL_RAG_PROFILE: cpu
    volumes:
      # Model weights persist across restarts; a cold container would otherwise
      # re-download about 2 GB before serving its first request.
      - model_cache:/models
      - ./data:/app/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  model_cache:
