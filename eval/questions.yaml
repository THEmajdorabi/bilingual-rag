# Evaluation set for bilingual-rag.
#
# REWRITTEN 2026-08-22 after the first version was diagnosed as non-discriminating.
# The original questions restated the article's own wording: mean lexical
# containment 0.517, 37% of questions sharing 75%+ of their content words with
# the labelled passage, and BM25 alone putting the right article at rank 1 for
# 52% of them. Retrieval scored 0.985 for every configuration, so the ablation
# table could not tell components apart. See DECISIONS.md.
#
# The rule for this version: **describe the situation, never the legal concept.**
#
#   BAD  ما هي مدة الإشعار المطلوبة قبل إنهاء عقد العمل غير محدد المدة؟
#        (reuses إشعار / إنهاء / عقد / غير محدد المدة -- every key term)
#   GOOD مديري قال لي اطلع بكرة وراتبي شهري، لازم يعطيني وقت؟
#        (my manager told me to leave tomorrow and I'm paid monthly, does he
#         have to give me time? -- no shared legal vocabulary at all)
#
# Gulf colloquial and common misspellings are used deliberately, because that is
# how the users of this system actually type. `ه`/`ة`, `ا`/`أ`, `ي`/`ى` confusion
# and dropped hamzas are the norm, not the exception.
#
# PROVENANCE: every question is `verified_by: drafted` -- written by a model
# against the real article text, but not yet checked by a person. Promote with
# `python eval/review.py`.
#
# `doc_id` says which document the article numbers belong to. The index now
# holds the Labor Law AND its Implementing Regulations, and both number an
# "article 15".

