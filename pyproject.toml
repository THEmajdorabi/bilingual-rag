[project]
name = "bilingual-rag"
version = "0.1.0"
description = "Ask in Arabic or English. Get an answer grounded in an Arabic legal corpus, cited to the article."
requires-python = ">=3.12"
dependencies = [
    # agent-core is the decision layer. Installed from a local path in dev;
    # see DECISIONS.md for why this is not a git dependency yet.
    "agent-core",
    "pymupdf>=1.24.0",
    "pyarabic>=0.6.15",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.12.0",
    "bm25s>=0.2.0",
    "PyStemmer>=2.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "numpy>=1.26.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
# OCR is only needed for scanned pages. Kept optional because it pulls system
# packages (tesseract, poppler) that a text-PDF corpus does not require.
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17.0", "Pillow>=10.4.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilingual_rag"]

[tool.uv.sources]
agent-core = { path = "../agent-core", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs external infrastructure (paid API, Qdrant, or a downloaded corpus); excluded from `make test`",
    "slow: loads an embedding model; excluded from `make test`",
]
addopts = "-m 'not integration and not slow' --strict-markers"

[tool.ruff.lint.per-file-ignores]
# B008 flags a function call in an argument default. `Depends(...)` in the
# signature is FastAPI's dependency-injection syntax, not an accidental
# mutable default -- FastAPI reads it off the signature and never evaluates it
# as a Python default. Moving the calls into the bodies would disable
# injection, and with it the 503-while-loading behaviour.
"src/bilingual_rag/api/main.py" = ["B008"]
