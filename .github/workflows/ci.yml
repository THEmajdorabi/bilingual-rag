name: ci

# What CI can check without a GPU, a running Qdrant, or an API key: lint,
# types, and the 133 tests that need none of those. The integration tests are
# excluded by the `-m 'not integration'` default in pyproject.toml, and the
# retrieval and answer evaluations are not run here at all, they need an
# ingested corpus and, for answers, money.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo depends on agent-core by LOCAL PATH, so CI needs it checked
      # out beside this one. Until that repository exists under the same owner
      # this step fails and the install below fails with it, which is why
      # agent-core is pushed first. See PUSH.md.
      - name: check out agent-core
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agent-core
          path: agent-core-sibling

      - name: put agent-core where the path dependency expects it
        run: mv agent-core-sibling ../agent-core

      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12

      # The CPU torch wheel: CI has no GPU and the CUDA build is 2.5 GB.
      - name: install
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e ".[dev]"

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: types
        run: uv run mypy src/bilingual_rag

      - name: tests
        run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bilingual-rag

      # The image builds from the PARENT directory so agent-core is inside the
      # build context. See the note at the top of the Dockerfile.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agent-core
          path: agent-core

      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bilingual-rag/Dockerfile
          push: false
          tags: bilingual-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
